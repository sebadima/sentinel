[env:esp32dev]
; LOCK DELLA PIATTAFORMA: Previene rotture causate da rolling releases
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; === PRE-BUILD SCRIPT ===

extra_scripts =
    pre:generate_secrets.py
    post:merge_bin.py

; OTTIMIZZAZIONI COMPILATORE: Debug level 1 (Solo Errori)
; FW_VERSION viene passato come intero C++, NON come stringa
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FW_VERSION=${sysenv.FW_VERSION}

; LOCK DELLE LIBRERIE: Versioni esatte e bloccate (senza ^)
lib_deps =
    adafruit/RTClib @ 2.1.3
    adafruit/Adafruit MAX31865 library @ 1.6.2
    adafruit/Adafruit BusIO @ 1.14.5
    adafruit/Adafruit Unified Sensor @ 1.1.14
    adafruit/DHT sensor library @ 1.4.6
    adafruit/Adafruit FRAM I2C @ 2.0.3
    bblanchon/ArduinoJson @ 6.21.3
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.9.1
    marcoschwartz/LiquidCrystal_I2C @ 1.1.2
    SPI
    Wire
    